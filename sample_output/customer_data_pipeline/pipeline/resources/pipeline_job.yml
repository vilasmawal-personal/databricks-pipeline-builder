# DAB Job Resource — Auto-generated by DPBA Component 3
# 3-task pipeline, one task per stage transition: ingest_raw_crm → transform_customer_dim → integration_tests
# pipeline_shared_cluster (autoscaling, sized from workflow_specification.job_clusters[0])
# runs the ingest/transform stages; test_utility_cluster (single-node) runs the
# lightweight fixture-load + integration-test tasks — least compute each task needs.

resources:
  jobs:
    Customer Data Pipeline_workflow_job:
      name: "Customer Data Pipeline_workflow_[${bundle.target}]"
      description: "Ingests raw CRM customer CSV exports and produces a clean, standardized customer dimension table in the lakehouse."

      # ── Cluster ───────────────────────────────────────────────────────
      # ⚠️  node_type_id is cloud-provider-specific (this one assumes AWS unless
      # ⚠️  workflow_specification.job_clusters[0].new_cluster.node_type_id was set
      # ⚠️  in the mapping JSON) — on Azure/GCP, replace it with a valid instance
      # ⚠️  type for your workspace before deploying, or `databricks bundle validate`
      # ⚠️  / the job run will fail with an invalid-node-type error.
      job_clusters:
        - job_cluster_key: pipeline_shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "m5d.large"
            autoscale:
              min_workers: 1
              max_workers: 2
            spark_conf:
                      "spark.databricks.delta.preview.enabled": "true"
            data_security_mode: "SINGLE_USER"

        # Single-node, driver-only cluster for the lightweight utility tasks
        # (load_test_fixtures: writes a few dozen literal rows; run_integration_tests:
        # counts/filters over those same small tables) — these never touch real data
        # volume, so they get the cheapest possible compute instead of sharing the
        # autoscaling cluster sized for the actual ingest/transform stages.
        - job_cluster_key: test_utility_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "m5d.large"
            num_workers: 0
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            custom_tags:
              "ResourceClass": "SingleNode"
            data_security_mode: "SINGLE_USER"

      # ── Tasks (dynamically built from the stage chain) ──────────────────
      tasks:
        - task_key: load_test_fixtures
          job_cluster_key: test_utility_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/00_load_test_fixtures
            base_parameters:
              synthetic_input_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_{{job.run_id}}_synthetic_input"
              expected_output_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_{{job.run_id}}_expected_output"
          timeout_seconds: 1800
          max_retries: 1

        - task_key: ingest_to_ingest_raw_crm
          job_cluster_key: pipeline_shared_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/01_ingest_ingest_raw_crm
            base_parameters:
              source_path: "${var.source_path}"
              ingest_raw_crm_table: "${var.catalog}.ingest_raw_crm.raw_crm_customers"
              run_date: "{{job.start_time.iso_date}}"
          timeout_seconds: 3600
          max_retries: 1

        - task_key: transform_to_transform_customer_dim
          depends_on:
            - task_key: ingest_to_ingest_raw_crm
          job_cluster_key: pipeline_shared_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/02_transform_transform_customer_dim
            base_parameters:
              ingest_raw_crm_table: "${var.catalog}.ingest_raw_crm.raw_crm_customers"
              transform_customer_dim_table: "${var.catalog}.transform_customer_dim.dim_customers"
              run_date: "{{job.start_time.iso_date}}"
              write_mode: "append"
          timeout_seconds: 3600
          max_retries: 1

        - task_key: test_ingest_to_ingest_raw_crm
          depends_on:
            - task_key: load_test_fixtures
          job_cluster_key: test_utility_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/01_ingest_ingest_raw_crm
            base_parameters:
              synthetic_input_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_{{job.run_id}}_synthetic_input"
              ingest_raw_crm_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_ingest_raw_crm_test_{{job.run_id}}"
              run_date: "{{job.start_time.iso_date}}"
              test_mode: "true"
          timeout_seconds: 1800
          max_retries: 0

        - task_key: test_transform_to_transform_customer_dim
          depends_on:
            - task_key: test_ingest_to_ingest_raw_crm
          job_cluster_key: test_utility_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/02_transform_transform_customer_dim
            base_parameters:
              ingest_raw_crm_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_ingest_raw_crm_test_{{job.run_id}}"
              transform_customer_dim_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_transform_customer_dim_test_{{job.run_id}}"
              quarantine_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_transform_customer_dim_test_{{job.run_id}}_quarantine"
              run_date: "{{job.start_time.iso_date}}"
              write_mode: "overwrite"
              test_mode: "true"
          timeout_seconds: 1800
          max_retries: 0

        - task_key: run_integration_tests
          depends_on:
            - task_key: test_transform_to_transform_customer_dim
            - task_key: load_test_fixtures
          job_cluster_key: test_utility_cluster
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/03_integration_tests
            base_parameters:
              transform_customer_dim_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_transform_customer_dim_test_{{job.run_id}}"
              run_date: "{{job.start_time.iso_date}}"
              quarantine_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_transform_customer_dim_test_{{job.run_id}}_quarantine"
              synthetic_input_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_{{job.run_id}}_synthetic_input"
              expected_output_table: "${var.catalog}.transform_customer_dim_test.transform_customer_dim_{{job.run_id}}_expected_output"
              test_mode: "true"

          timeout_seconds: 1800
          max_retries: 0    # never auto-retry failed tests — require human approval

      # ── Schedule (PAUSED in dev by default) ──────────────────────────
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      # ── Notifications ─────────────────────────────────────────────────
      email_notifications:
        on_failure:
          - "your-team@example.com"
        no_alert_for_skipped_runs: true

      # ── Tags ──────────────────────────────────────────────────────────
      tags:
        project:      "dpba"
        pipeline:     "Customer Data Pipeline_workflow"
        environment:  "${var.env}"
        generated_by: "DPBA-Component3"
