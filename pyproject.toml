[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-pipeline-builder-assistant"
version = "0.3.0"
description = "Local-LLM-assisted deterministic Databricks pipeline generator"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
dpba = "dpba.__main__:main"

[tool.setuptools]
packages = ["dpba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: tests that require a live Ollama server (deselect with '-m not ollama')",
]
