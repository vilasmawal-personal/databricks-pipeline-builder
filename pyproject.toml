[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-pipeline-builder-assistant"
version = "0.2.0"
description = "Local-LLM-assisted deterministic Databricks pipeline generator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
dpba = "dpba.__main__:main"

[tool.setuptools]
packages = ["dpba"]
